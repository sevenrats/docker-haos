# Shadows /usr/lib/systemd/system.conf.d/watchdog.conf. HAOS arms the hardware
# watchdog for bare-metal installs; in a privileged container /dev/watchdog is
# the *host's* watchdog, and an unclean container exit would reboot the host.
[Manager]
RuntimeWatchdogSec=off
RebootWatchdogSec=off
KExecWatchdogSec=off
WatchdogDevice=
