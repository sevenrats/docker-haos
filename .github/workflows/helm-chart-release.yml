name: Publish Helm Chart

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CHART_PATH: charts/docker-haos
  CHART_NAME: docker-haos
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Resolve chart version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version: *//p' "${CHART_PATH}/Chart.yaml")"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Package chart
        run: |
          mkdir -p dist
          helm lint "${CHART_PATH}"
          helm package "${CHART_PATH}" --version "${VERSION}" --destination dist

      - name: Log in to GHCR
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart
        run: |
          helm push "dist/${CHART_NAME}-${VERSION}.tgz" "${CHART_REPO}"
