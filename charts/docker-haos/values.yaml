replicaCount: 1

image:
  repository: ghcr.io/sevenrats/haos
  tag: "18.3"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

hostNetwork: false
# Time for systemd to stop Home Assistant and dockerd cleanly.
terminationGracePeriodSeconds: 120
dnsPolicy: Default
useDummyNetworkManager: true
useUdevShim: auto
# Port Home Assistant serves the onboarding page on (HA 2026.8+ defaults to 80).
setupPort: "8123"
# Re-enable IPv6 on the pod's interfaces (the node's interfaces with hostNetwork).
enableIpv6: true
useHostDevSerial: true

service:
  enabled: true
  type: ClusterIP
  port: 8123

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: haos.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  scheme: http
  honorLabels: false
  labels:
    release: kube-prometheus-stack

persistence:
  enabled: false
  mountPath: /mnt/data
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClass: ""
  existingClaim: ""
  hostPath: ""

securityContext:
  privileged: true

apparmor:
  unconfined: true

podAnnotations: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
